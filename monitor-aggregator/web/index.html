<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>monitor-aggregator</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e6e6e6; }
  header { padding: 16px 24px; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .meta { color: #888; font-size: 13px; }
  .tabs { display: flex; gap: 6px; padding: 12px 24px 0; border-bottom: 1px solid #222; flex-wrap: wrap; }
  .tab { padding: 8px 14px; cursor: pointer; border-radius: 6px 6px 0 0; color: #aaa; border: 1px solid transparent; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .tab.active { background: #181a20; color: #fff; border-color: #262830; border-bottom-color: transparent; }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tab .dot.ok { background: #57c785; }
  .tab .dot.fail { background: #e06c75; }
  main { padding: 20px 24px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: #181a20; border: 1px solid #262830; border-radius: 8px; padding: 14px 16px; }
  .card.ok { border-color: #1f5132; }
  .card.fail { border-color: #58151c; }
  .name { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .host { color: #8a8a8a; font-size: 12px; margin-top: 2px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 4px; }
  .badge.ok { background: #1f5132; color: #d1f1d8; }
  .badge.fail { background: #58151c; color: #f5c2c7; }
  ul.checks { list-style: none; padding: 0; margin: 10px 0 0 0; font-size: 13px; }
  ul.checks li { padding: 3px 0; display: flex; justify-content: space-between; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.ok { background: #57c785; }
  .dot.fail { background: #e06c75; }
  .unreachable { padding: 14px 16px; background: #2a1518; border: 1px solid #58151c; border-radius: 8px; color: #f5c2c7; }
  .login { max-width: 360px; margin: 80px auto; padding: 24px; background: #181a20; border: 1px solid #262830; border-radius: 8px; }
  .login input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #0f1115; color: #e6e6e6; font-size: 14px; }
  .login button { width: 100%; margin-top: 12px; padding: 10px; border-radius: 6px; border: 0; background: #2f6feb; color: #fff; font-size: 14px; cursor: pointer; }
  .err { color: #e06c75; font-size: 13px; margin-top: 8px; }
  .logout { background: transparent; border: 1px solid #333; color: #aaa; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .adhoc { padding: 12px 24px; border-bottom: 1px solid #222; background: #141519; }
  .adhoc-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .adhoc-form select, .adhoc-form input, .adhoc-form button { padding: 7px 10px; border-radius: 6px; background: #0f1115; color: #e6e6e6; border: 1px solid #333; font-size: 13px; font-family: inherit; }
  .adhoc-form input { flex: 1; min-width: 220px; }
  .adhoc-form button { background: #2f6feb; border: 0; cursor: pointer; padding-left: 14px; padding-right: 14px; }
  .adhoc-form button:disabled { opacity: 0.6; cursor: wait; }
  .adhoc-form label { color: #888; font-size: 12px; }
  .adhoc-result { margin-top: 10px; padding: 8px 12px; border-radius: 6px; font-size: 13px; word-break: break-all; }
  .adhoc-result.ok { background: #17321f; color: #d1f1d8; border: 1px solid #1f5132; }
  .adhoc-result.fail { background: #2a1518; color: #f5c2c7; border: 1px solid #58151c; }
  .adhoc-result .dot { vertical-align: middle; }
  .adhoc-loading { margin-top: 10px; color: #888; font-size: 13px; }
  .metrics { margin-top: 24px; }
  .metrics-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .metrics-header h2 { font-size: 14px; margin: 0; color: #aaa; font-weight: 600; }
  .range-btns { display: flex; gap: 4px; }
  .range-btns button { padding: 4px 10px; border-radius: 4px; background: #181a20; color: #aaa; border: 1px solid #262830; cursor: pointer; font-size: 12px; font-family: inherit; }
  .range-btns button.active { background: #2f6feb; color: #fff; border-color: #2f6feb; }
  .metrics-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .metric-box { background: #181a20; border: 1px solid #262830; border-radius: 8px; padding: 12px 14px; }
  .metric-title { font-size: 12px; color: #888; display: flex; justify-content: space-between; margin-bottom: 6px; }
  .metric-current { color: #e6e6e6; font-weight: 600; font-size: 13px; }
  .metric-box canvas { width: 100%; height: 80px; display: block; }
  .metric-canvas-wrap { position: relative; }
  .metric-axis { display: flex; justify-content: space-between; font-size: 10px; color: #666; margin-top: 4px; }
  .metric-tip { position: absolute; background: #0f1115; border: 1px solid #333; border-radius: 4px; padding: 4px 8px; font-size: 11px; color: #ddd; pointer-events: none; display: none; white-space: nowrap; z-index: 5; line-height: 1.4; }
  .metric-tip b { color: #fff; }
  .metric-empty { color: #555; font-size: 12px; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const TOKEN_KEY = "monitor-aggregator-token";
let activeTab = 0;
let authMode = "none"; // "none" | "token" | "userpass"

async function api(path) {
  const headers = {};
  if (authMode === "token") {
    const token = sessionStorage.getItem(TOKEN_KEY) || "";
    if (token) headers.Authorization = "Bearer " + token;
  }
  const res = await fetch(path, { headers, credentials: "same-origin" });
  if (res.status === 401) throw new Error("unauthorized");
  if (!res.ok) throw new Error("http " + res.status);
  return res.json();
}

function renderLogin(err) {
  shellBuilt = false;
  loginVisible = true;
  const isUserpass = authMode === "userpass";
  const fields = isUserpass
    ? `<input id="u" placeholder="логин" autofocus>
       <input id="p" type="password" placeholder="пароль" style="margin-top:8px">`
    : `<input id="t" type="password" placeholder="токен" autofocus>`;
  document.getElementById("app").innerHTML = `
    <div class="login">
      <h1 style="margin:0 0 12px 0">monitor-aggregator</h1>
      <p style="color:#8a8a8a;font-size:13px;margin:0 0 12px 0">Вход</p>
      ${fields}
      <button id="ok">Войти</button>
      ${err ? `<div class="err">${err}</div>` : ""}
    </div>`;
  const submit = async () => {
    if (isUserpass) {
      const u = document.getElementById("u").value;
      const p = document.getElementById("p").value;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p }),
          credentials: "same-origin",
        });
        if (res.ok) bootstrap();
        else renderLogin("Неверный логин или пароль");
      } catch (e) {
        renderLogin("Ошибка сети: " + e.message);
      }
    } else {
      sessionStorage.setItem(TOKEN_KEY, document.getElementById("t").value);
      bootstrap();
    }
  };
  document.getElementById("ok").onclick = submit;
  document.querySelectorAll(".login input").forEach(i => {
    i.onkeydown = (e) => { if (e.key === "Enter") submit(); };
  });
}

async function logout() {
  if (authMode === "userpass") {
    try { await fetch("/api/logout", { method: "POST", credentials: "same-origin" }); } catch {}
  } else {
    sessionStorage.removeItem(TOKEN_KEY);
  }
  renderLogin();
}

function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleString() : "—"; }

function checkRow(label, ok, detail) {
  return `<li><span><span class="dot ${ok ? "ok" : "fail"}"></span>${label}</span><span style="color:#888">${detail || ""}</span></li>`;
}

function renderServer(srv) {
  const c = srv.checks || {};
  const rows = [];
  if (c.ping) rows.push(checkRow("ping", c.ping.ok, c.ping.ok ? (c.ping.latency_ms + " ms") : (c.ping.error || "fail")));
  for (const t of (c.tcp || [])) rows.push(checkRow("tcp " + t.port, t.ok, t.ok ? (t.latency_ms + " ms") : (t.error || "fail")));
  for (const h of (c.http || [])) rows.push(checkRow("http " + h.url, h.ok, h.ok ? (h.code + (h.keyword ? " ✓kw" : "")) : ("code " + (h.code || "?"))));
  return `
    <div class="card ${srv.ok ? "ok" : "fail"}">
      <div class="name">
        <span>${srv.name}</span>
        <span class="badge ${srv.ok ? "ok" : "fail"}">${srv.ok ? "OK" : "FAIL"}</span>
      </div>
      <div class="host">${srv.host}</div>
      <ul class="checks">${rows.join("")}</ul>
    </div>`;
}

function instanceOk(inst) {
  if (!inst.reachable) return false;
  return (inst.state?.servers || []).every(s => s.ok);
}

const RANGES = ["1h", "6h", "24h"];
let metricsRange = "1h";
const metricsCache = {}; // `${instance}|${range}` -> { fetchedAt, data }

function renderInstanceContent(inst) {
  if (!inst.reachable) {
    return `<div class="unreachable">⚠ ДЦ недоступен: ${escapeHtml(inst.error || "unknown")}<div style="color:#888;font-size:12px;margin-top:4px">${escapeHtml(inst.url)}</div></div>`;
  }
  const servers = inst.state?.servers || [];
  const grid = servers.length ? `<div class="grid">${servers.map(renderServer).join("")}</div>` : `<p style="color:#888">Серверы не настроены.</p>`;
  const ranges = RANGES.map(r => `<button data-range="${r}" class="${r === metricsRange ? "active" : ""}">${r === "1h" ? "1ч" : r === "6h" ? "6ч" : "24ч"}</button>`).join("");
  const metrics = `
    <div class="metrics" data-instance="${escapeHtml(inst.name)}">
      <div class="metrics-header">
        <h2>Метрики</h2>
        <div class="range-btns">${ranges}</div>
      </div>
      <div class="metrics-grid">
        <div class="metric-box metric-cpu">
          <div class="metric-title">CPU<span class="metric-current">—</span></div>
          <div class="metric-canvas-wrap"><canvas></canvas><div class="metric-tip"></div></div>
          <div class="metric-axis"><span class="start"></span><span class="end"></span></div>
        </div>
        <div class="metric-box metric-ram">
          <div class="metric-title">RAM<span class="metric-current">—</span></div>
          <div class="metric-canvas-wrap"><canvas></canvas><div class="metric-tip"></div></div>
          <div class="metric-axis"><span class="start"></span><span class="end"></span></div>
        </div>
        <div class="metric-box metric-net">
          <div class="metric-title">Net<span class="metric-current">—</span></div>
          <div class="metric-canvas-wrap"><canvas></canvas><div class="metric-tip"></div></div>
          <div class="metric-axis"><span class="start"></span><span class="end"></span></div>
        </div>
      </div>
    </div>`;
  return grid + metrics;
}

function pad2(n) { return String(n).padStart(2, "0"); }

function fmtAxisTime(ts, range) {
  const d = new Date(ts * 1000);
  if (range === "24h") {
    return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function fmtTipTime(ts) {
  const d = new Date(ts * 1000);
  return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

function attachHover(box, points, formatter) {
  const canvas = box.querySelector("canvas");
  const tip = box.querySelector(".metric-tip");
  if (!canvas || !tip) return;
  if (!points || points.length < 2) {
    canvas.onmousemove = null;
    canvas.onmouseleave = null;
    tip.style.display = "none";
    return;
  }
  const minTs = points[0].ts;
  const maxTs = points[points.length - 1].ts;
  const tsRange = Math.max(1, maxTs - minTs);
  canvas.style.cursor = "crosshair";
  canvas.onmousemove = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const w = canvas.clientWidth;
    const ts = minTs + Math.max(0, Math.min(1, x / w)) * tsRange;
    let best = points[0], bestDist = Math.abs(best.ts - ts);
    for (const p of points) {
      const d = Math.abs(p.ts - ts);
      if (d < bestDist) { best = p; bestDist = d; }
    }
    tip.innerHTML = formatter(best);
    tip.style.display = "block";
    const tipW = tip.offsetWidth || 120;
    const left = Math.max(0, Math.min(w - tipW - 4, x + 8));
    tip.style.left = left + "px";
    tip.style.top = "4px";
  };
  canvas.onmouseleave = () => { tip.style.display = "none"; };
}

function fmtBytes(b) {
  if (!b || b < 0) return "0 B";
  if (b < 1024) return b.toFixed(0) + " B";
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
  if (b < 1024 * 1024 * 1024) return (b / (1024 * 1024)).toFixed(1) + " MB";
  return (b / (1024 * 1024 * 1024)).toFixed(2) + " GB";
}

async function fetchMetrics(instanceName) {
  const key = `${instanceName}|${metricsRange}`;
  const cached = metricsCache[key];
  if (cached && Date.now() - cached.fetchedAt < 25000) return cached.data;
  try {
    const headers = {};
    if (authMode === "token") {
      const t = sessionStorage.getItem(TOKEN_KEY) || "";
      if (t) headers.Authorization = "Bearer " + t;
    }
    const res = await fetch(`/api/metrics?instance=${encodeURIComponent(instanceName)}&range=${encodeURIComponent(metricsRange)}`,
      { headers, credentials: "same-origin" });
    if (!res.ok) return null;
    const data = await res.json();
    metricsCache[key] = { fetchedAt: Date.now(), data };
    return data;
  } catch { return null; }
}

function drawSparkline(canvas, points, opts) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 280;
  const h = canvas.clientHeight || 80;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (!points || points.length < 2) {
    ctx.fillStyle = "#555";
    ctx.font = "12px sans-serif";
    ctx.fillText("ждём первых точек…", 8, h / 2 + 4);
    return;
  }
  const padX = 4, padY = 6;
  const innerW = w - padX * 2;
  const innerH = h - padY * 2;
  const minTs = points[0].ts;
  const maxTs = points[points.length - 1].ts;
  const tsRange = Math.max(1, maxTs - minTs);

  const allVals = [];
  for (const p of points) { allVals.push(p.value0); if (p.value1 != null) allVals.push(p.value1); }
  let yMin = opts.yMin != null ? opts.yMin : Math.min(...allVals);
  let yMax = opts.yMax != null ? opts.yMax : Math.max(...allVals);
  if (yMax === yMin) yMax = yMin + 1;

  const xp = (ts) => padX + ((ts - minTs) / tsRange) * innerW;
  const yp = (v) => padY + (1 - (v - yMin) / (yMax - yMin)) * innerH;

  ctx.strokeStyle = "#262830";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padX, h - padY);
  ctx.lineTo(w - padX, h - padY);
  ctx.stroke();

  const drawLine = (key, color, fill) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    points.forEach((p, i) => {
      const v = p[key];
      if (v == null) return;
      const x = xp(p.ts);
      const y = yp(v);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    if (fill) {
      ctx.lineTo(xp(points[points.length - 1].ts), h - padY);
      ctx.lineTo(xp(points[0].ts), h - padY);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }
  };

  drawLine("value0", opts.color0, opts.fill0);
  if (opts.color1) drawLine("value1", opts.color1, null);
}

async function renderMetricsFor(instanceName) {
  const box = document.querySelector(`.metrics[data-instance="${CSS.escape(instanceName)}"]`);
  if (!box) return;
  const data = await fetchMetrics(instanceName);
  if (!data) {
    box.querySelector(".metric-cpu .metric-current").textContent = "—";
    box.querySelector(".metric-ram .metric-current").textContent = "—";
    box.querySelector(".metric-net .metric-current").textContent = "—";
    for (const c of box.querySelectorAll("canvas")) drawSparkline(c, [], {});
    return;
  }
  const points = data.points || [];
  const last = points[points.length - 1] || {};

  const setAxis = (selector) => {
    const ax = box.querySelector(selector + " .metric-axis");
    if (!ax) return;
    if (points.length >= 2) {
      ax.querySelector(".start").textContent = fmtAxisTime(points[0].ts, data.range);
      ax.querySelector(".end").textContent = fmtAxisTime(points[points.length - 1].ts, data.range);
    } else {
      ax.querySelector(".start").textContent = "";
      ax.querySelector(".end").textContent = "";
    }
  };

  drawSparkline(box.querySelector(".metric-cpu canvas"),
    points.map(p => ({ ts: p.ts, value0: p.cpu })),
    { yMin: 0, yMax: 100, color0: "#57c785", fill0: "rgba(87,199,133,0.12)" });
  box.querySelector(".metric-cpu .metric-current").textContent = last.cpu != null ? `${last.cpu}%` : "—";
  setAxis(".metric-cpu");
  attachHover(box.querySelector(".metric-cpu"), points,
    p => `<b>${escapeHtml(fmtTipTime(p.ts))}</b><br>CPU: ${p.cpu}%`);

  drawSparkline(box.querySelector(".metric-ram canvas"),
    points.map(p => ({ ts: p.ts, value0: p.mem })),
    { yMin: 0, yMax: 100, color0: "#5b9af7", fill0: "rgba(91,154,247,0.12)" });
  box.querySelector(".metric-ram .metric-current").textContent = last.mem != null ? `${last.mem}%` : "—";
  setAxis(".metric-ram");
  attachHover(box.querySelector(".metric-ram"), points,
    p => `<b>${escapeHtml(fmtTipTime(p.ts))}</b><br>RAM: ${p.mem}%`);

  drawSparkline(box.querySelector(".metric-net canvas"),
    points.map(p => ({ ts: p.ts, value0: p.rx, value1: p.tx })),
    { yMin: 0, color0: "#5b9af7", color1: "#e8a857" });
  box.querySelector(".metric-net .metric-current").innerHTML =
    `<span style="color:#5b9af7">↓${escapeHtml(fmtBytes(last.rx || 0))}/s</span> · <span style="color:#e8a857">↑${escapeHtml(fmtBytes(last.tx || 0))}/s</span>`;
  setAxis(".metric-net");
  attachHover(box.querySelector(".metric-net"), points,
    p => `<b>${escapeHtml(fmtTipTime(p.ts))}</b><br><span style="color:#5b9af7">↓ ${escapeHtml(fmtBytes(p.rx || 0))}/s</span><br><span style="color:#e8a857">↑ ${escapeHtml(fmtBytes(p.tx || 0))}/s</span>`);
}

function wireMetricsControls(instanceName) {
  const box = document.querySelector(`.metrics[data-instance="${CSS.escape(instanceName)}"]`);
  if (!box) return;
  box.querySelectorAll(".range-btns button").forEach(b => {
    b.onclick = () => {
      metricsRange = b.dataset.range;
      box.querySelectorAll(".range-btns button").forEach(x => x.classList.toggle("active", x === b));
      renderMetricsFor(instanceName);
    };
  });
}

let lastState = null;
let shellBuilt = false;
let loginVisible = false;

function buildShell() {
  document.getElementById("app").innerHTML = `
    <header>
      <div>
        <h1>monitor-aggregator</h1>
        <div class="meta" id="meta"></div>
      </div>
      <button class="logout" id="logout">Выйти</button>
    </header>
    <div class="adhoc">
      <div class="adhoc-form">
        <label>откуда:</label>
        <select id="adhoc-instance"></select>
        <label>тип:</label>
        <select id="adhoc-type">
          <option value="ping">ping</option>
          <option value="tcp">tcp host:port</option>
          <option value="http">http(s) URL</option>
        </select>
        <input id="adhoc-target" placeholder="host, host:port или URL">
        <button id="adhoc-go">Проверить</button>
      </div>
      <div id="adhoc-result"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <main id="content"></main>`;
  document.getElementById("logout").onclick = logout;
  document.getElementById("adhoc-go").onclick = runAdhocCheck;
  document.getElementById("adhoc-target").addEventListener("keydown", (e) => {
    if (e.key === "Enter") runAdhocCheck();
  });
}

function renderDashboard(state) {
  lastState = state;
  loginVisible = false;
  if (!shellBuilt) { buildShell(); shellBuilt = true; }

  const instances = state.instances || [];
  if (activeTab >= instances.length) activeTab = 0;

  document.getElementById("meta").textContent =
    `Обновлено: ${fmtTime(state.generated_at)} · интервал ${state.interval}s · ДЦ: ${instances.length}`;

  const sel = document.getElementById("adhoc-instance");
  const prev = sel.value;
  sel.innerHTML = instances.map(i => `<option value="${escapeHtml(i.name)}">${escapeHtml(i.name)}</option>`).join("");
  if (prev && instances.some(i => i.name === prev)) sel.value = prev;
  else if (instances[activeTab]) sel.value = instances[activeTab].name;

  const tabsDiv = document.getElementById("tabs");
  tabsDiv.innerHTML = instances.map((inst, i) => `
    <div class="tab ${i === activeTab ? "active" : ""}" data-idx="${i}">
      <span class="dot ${instanceOk(inst) ? "ok" : "fail"}"></span>${escapeHtml(inst.name)}
    </div>`).join("");
  tabsDiv.querySelectorAll(".tab").forEach(el => {
    el.onclick = () => { activeTab = +el.dataset.idx; renderDashboard(lastState); };
  });

  document.getElementById("content").innerHTML =
    instances[activeTab] ? renderInstanceContent(instances[activeTab]) : "<p>Нет данных.</p>";

  const current = instances[activeTab];
  if (current && current.reachable) {
    wireMetricsControls(current.name);
    renderMetricsFor(current.name);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function runAdhocCheck() {
  const instance = document.getElementById("adhoc-instance").value;
  const type = document.getElementById("adhoc-type").value;
  const target = document.getElementById("adhoc-target").value.trim();
  const result = document.getElementById("adhoc-result");
  const btn = document.getElementById("adhoc-go");
  if (!target) { result.innerHTML = `<div class="adhoc-result fail">Введите цель.</div>`; return; }
  result.innerHTML = `<div class="adhoc-loading">Проверяю…</div>`;
  btn.disabled = true;
  try {
    const headers = { "Content-Type": "application/json" };
    if (authMode === "token") {
      const t = sessionStorage.getItem(TOKEN_KEY) || "";
      if (t) headers.Authorization = "Bearer " + t;
    }
    const res = await fetch("/api/check", {
      method: "POST", headers, credentials: "same-origin",
      body: JSON.stringify({ instance, type, target }),
    });
    if (res.status === 401) { result.innerHTML = ""; renderLogin("Сессия истекла"); return; }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      result.innerHTML = `<div class="adhoc-result fail">Ошибка: ${escapeHtml(data.error || ("HTTP " + res.status))}</div>`;
      return;
    }
    result.innerHTML = renderAdhocResult(data);
  } catch (e) {
    result.innerHTML = `<div class="adhoc-result fail">Сеть: ${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderAdhocResult(data) {
  const r = data.result || {};
  const ok = !!r.ok;
  const dot = `<span class="dot ${ok ? "ok" : "fail"}"></span>`;
  let detail = "";
  if (data.type === "ping" || data.type === "tcp") {
    detail = ok ? `${r.latency_ms} ms` : (r.error || "fail");
  } else if (data.type === "http") {
    detail = ok ? `code ${r.code} · ${r.latency_ms} ms` : `code ${r.code ?? "?"} · ${r.error || "fail"}`;
  } else {
    detail = JSON.stringify(r);
  }
  return `<div class="adhoc-result ${ok ? "ok" : "fail"}">${dot} <b>${escapeHtml(data.type)}</b> ${escapeHtml(data.target)} — ${escapeHtml(detail)}</div>`;
}

async function bootstrap() {
  try {
    const req = await fetch("/api/auth-required").then(r => r.json()).catch(() => ({ required: false, mode: "none" }));
    authMode = req.mode || "none";
    const state = await api("/api/state");
    renderDashboard(state);
  } catch (e) {
    if (e.message === "unauthorized") renderLogin(authMode === "userpass" ? null : "Неверный токен");
    else document.getElementById("app").innerHTML = `<main><p class="err">Ошибка: ${e.message}</p></main>`;
  }
}

bootstrap();
setInterval(() => { if (!loginVisible) bootstrap(); }, 15000);
</script>
