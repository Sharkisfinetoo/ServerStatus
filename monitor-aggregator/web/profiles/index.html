<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профили VPN</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1115; color: #e6e6e6; }
  header { padding: 20px 24px; border-bottom: 1px solid #222; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .meta { color: #8a8a8a; font-size: 13px; margin-top: 4px; }
  main { padding: 24px; max-width: 640px; margin: 0 auto; }
  .grid { display: grid; gap: 12px; }
  a.card { display: block; background: #181a20; border: 1px solid #262830; border-radius: 8px; padding: 16px 18px; color: #e6e6e6; text-decoration: none; }
  a.card:hover { border-color: #2f6feb; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .hint { color: #8a8a8a; font-size: 13px; margin-top: 4px; }
  .empty { color: #8a8a8a; font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>
<header>
  <h1>Профили VPN</h1>
  <div class="meta">Выберите сервер, для которого у вас есть имя профиля</div>
</header>
<main>
  <div id="list" class="grid"><div class="empty">Загрузка…</div></div>
</main>
<script>
fetch("/profiles/api/list", { credentials: "same-origin" })
  .then(r => r.json())
  .then(data => {
    const el = document.getElementById("list");
    const servers = data.servers || [];
    if (!servers.length) {
      el.innerHTML = '<div class="empty">Пока не настроено ни одного сервера с профилями.</div>';
      return;
    }
    el.innerHTML = servers.map(s => `
      <a class="card" href="/profiles/${encodeURIComponent(s.id)}">
        <div class="name">${s.title}</div>
        <div class="hint">Инструкция и скачивание профиля</div>
      </a>
    `).join("");
  })
  .catch(() => {
    document.getElementById("list").innerHTML = '<div class="empty">Не удалось загрузить список серверов.</div>';
  });
</script>
</body>
</html>
